<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dooduel — draw &amp; guess (web)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f4f1ea; overflow: hidden; touch-action: none; }
    #buiy { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
  <!-- data-wasm-opt="0": disable trunk's built-in wasm-opt. trunk auto-runs it
       (when wasm-opt is on PATH) as bare `-O`, without the wasm-feature flags
       modern rustc emits (bulk-memory/…), so it aborts the build. build-web.sh's
       release path runs wasm-opt itself with `-Oz -all` instead. -->
  <link data-trunk rel="rust" data-bin="dooduel_web" data-wasm-opt="0" />
</head>
<body>
  <canvas id="buiy"></canvas>
</body>
</html>
