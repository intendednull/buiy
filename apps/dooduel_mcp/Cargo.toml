# Dooduel M1 W5: the headless MCP agent client (spec §7). A native-only package with
# BOTH a lib target (the `HeadlessClient` the two-process e2e dev-depends on, spec §9.5)
# and a `doc = false` bin (the stdio JSON-RPC MCP server an LLM agent drives). It owns a
# `dooduel_core` replica behind the shared `WsClientTransport` — at the `Session` it is
# indistinguishable from a GUI client. NO Bevy/Buiy GUI stack: `dooduel_core` only.
[package]
name = "dooduel_mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "dooduel_mcp"
path = "src/lib.rs"

# `doc = false` per the repo's bin convention (the rustdoc bin-collision precedent).
[[bin]]
name = "dooduel_mcp"
path = "src/main.rs"
doc = false

[dependencies]
# The pure authority/protocol/canvas core + the shared client WebSocket transport
# (ws-client) — the ONE production client transport, reused verbatim (spec §2.1).
dooduel_core = { path = "../dooduel_core", features = ["ws-client"] }
# The stdio JSON-RPC 2.0 wire + the tool-argument decode (spec §7).
serde_json = { workspace = true }
# `get_canvas` PNG encode — the op log rasterized locally (spec §2.2/§7); no PNG on the
# wire. `base64` encodes it into an MCP image content block.
image = { workspace = true }
base64 = { workspace = true }
