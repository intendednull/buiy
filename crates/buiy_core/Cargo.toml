[package]
name = "buiy_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
taffy.workspace = true
tracing.workspace = true
bytemuck.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
# In-process AccessKit consumer — the same retained-tree reader a real
# assistive technology drives (inprocess-api.md §6). The P1c in-process
# inspection driver (`a11y::inprocess`) feeds `build_tree_update`'s `TreeUpdate`
# into an `accesskit_consumer::Tree` and reads each node BACK through the
# consumer (role-implied defaults, relation resolution, focus) — the
# act-then-observe `snapshot`. The driver is `buiy_core`'s, so the dependency is
# `buiy_core`'s (it was previously declared only on `buiy_verify`, which reaches
# it transitively); `buiy_verify`/`buiy_mcp` consume it through here.
# Already in the graph via the `accesskit_winit` → `accesskit_unix` →
# `accesskit_atspi_common` stack (`cargo tree -i accesskit_consumer@0.36.0`):
# declaring it adds NO new supply-chain node, just an explicit edge. Pinned to
# the version the resolved accesskit 0.24.1 stack already pulls (0.36.0).
accesskit_consumer.workspace = true
guillotiere = { workspace = true }
smallvec = { workspace = true }
# arboard moved to the non-wasm target table below (no wasm backend — D4).
bitflags = "2.11.1"
# Text engine (buiy-text-rendering-design, architecture § 7): Buiy's OWN pin,
# never ridden transitively (the bevy_cosmic_edit decay path). DEFAULT
# FEATURES ONLY — `shape-run-cache` stays OFF (decided in spec review round 1;
# architecture § 7 is the decision record): the retained TextBuffer's
# per-line caches already amortize re-shaping, while the run cache grows
# FontSystem-side without bound (gate #15). All fontdb types are consumed
# through cosmic-text's crate-root `pub use fontdb` re-export — no second
# fontdb pin (font-assets § 1). Every version bump re-verifies the
# load-bearing API facts against docs.rs (architecture § 7) and re-runs
# `cargo deny check` first (CLAUDE.md supply-chain gate).
cosmic-text = "0.19"
# The locale for FontSystem::new_with_locale_and_db_and_fallback
# (architecture § 2.1 "Locale via the sys-locale default feature"):
# cosmic-text keeps its own sys_locale call private, so Buiy mirrors it
# exactly (get_locale().unwrap_or "en-US"). Version-synced to cosmic-text
# 0.19's own pin (0.3.2) — cargo unifies to one copy.
sys-locale = "0.3"
# Names the `Script` parameter in cosmic_text::Fallback::script_fallback —
# cosmic-text re-exports fontdb/skrifa/harfrust but NOT unicode-script.
# Version-synced to cosmic-text 0.19's pin (0.5.8); an upstream bump to 0.6
# surfaces here as a loud type-mismatch compile error, by design.
unicode-script = "0.5"
# Grapheme-cluster boundaries for grapheme-correct Backspace (editing-and-ime
# § 3.1, normative): cosmic-text 0.19's `Action::Backspace` deletes a single
# CODE POINT (`char_indices().next_back()`, editor.rs:584), NOT a grapheme
# cluster — so an emoji-ZWJ family or a base+combining-mark loses only its last
# scalar. `Action::Delete` IS grapheme-correct (it uses `grapheme_indices`), so
# Buiy mirrors that for the backward direction here. Version-synced to
# cosmic-text 0.19's own pin (1.12) — cargo unifies to the one copy already in
# the graph; no new crate enters the tree.
unicode-segmentation = "1.12"
# The canonical `render::golden::Dpr` derives `serde::{Serialize, Deserialize}`
# so the verification golden bless ledger (`buiy_verify`) can persist it
# directly. `serde` is a workspace dep already; buiy_core names it directly
# because the derive emits `::serde::…` paths (bevy's re-export does not satisfy
# a bare `serde::Serialize` derive). Rides the workspace `serde` pin — no new
# crate enters the tree.
serde.workspace = true
# The promoted `render::golden::capture_to_image` returns an
# `image::RgbaImage` (verification-design README § Crate-dependency note: the
# ONLY new GPU dep buiy_core gains). Rides the existing workspace `image`
# pin — no second image-decode stack enters the tree.
image.workspace = true
# Vector-icon tessellation (parity Wave B3, parity-design § 3.5): lyon parses
# the design's SVG `<path d>` and STROKE-tessellates it to a triangle mesh
# (round caps/joins, arcs), which `render::icon_raster` supersamples to an R8
# coverage bitmap inserted into the EXISTING glyph-alpha atlas (no new GPU
# code — the coverage shader carries coverage+tint, so an icon recolors live
# on theme swap exactly like text). lyon is chosen over an icon-font because the
# design's stroke-width varies 1.7–2.4 (a font bakes ONE width). `lyon_extra`
# carries the SVG-path-`d` parser (over `svgtypes`); `lyon` carries the
# tessellator. MIT/Apache-2.0. Pinned to the workspace deps below.
lyon = { workspace = true }
lyon_extra = { workspace = true }
# RON record tap for the MVU substrate (prototype-3 W1, `src/mvu`): `MsgLog`
# Reflect-serializes folded messages to RON. Rides the version `bevy_asset`
# already resolves (0.12.1) — no new crate enters the tree.
ron = { workspace = true }

# arboard has no wasm backend (D4) — native-only clipboard dep. The web build
# reaches the OS clipboard via `WebClipboard` (text/edit/clipboard.rs) instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { workspace = true }

# The web build's OS clipboard: `WebClipboard` uses web-sys `navigator.clipboard`
# (behind the `web_sys_unstable_apis` cfg — .cargo/config.toml) + `spawn_local` for
# the async paste latch. All four crates are already in the graph via bevy's wasm
# deps; these version reqs match the committed lock (no new lock crates), and only
# add the Clipboard/Navigator/Window web-sys features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[features]
default = ["default_font"]
# Embed the deterministic default font (Fira Sans Regular latin subset,
# OFL-1.1 — font-assets § 4) and pin all five generic families to it, so
# Family::SansSerif etc. resolve identically on every host. Disable to ship
# zero font bytes — the app must then register fonts before any text renders.
default_font = []
# The clipboard image flavor (editing-and-ime § 7). OFF by default: it turns on
# arboard's `image-data` feature, which drags in the image-clipboard deps
# (objc2-core-graphics on macOS, gdi on Windows; the `image` crate is already
# in-tree). The text + HTML flavors need none of this, so the text-only build
# stays lean. Exercised with `cargo test -p buiy_core --features clipboard-image`
# — the default `cargo test --workspace` gate runs with this OFF.
clipboard-image = ["arboard/image-data"]
# MT-safety (2026-06-30): opt-in passthrough to Bevy's multithreaded ECS executor.
# OFF by default — Buiy runs single-threaded in its OWN builds (wasm is hard
# single-threaded; the perf/determinism gates assume single-thread; the serial
# NonSend-pinned hot path gains nothing from threads). But downstream apps already
# enable `multi_threaded` transitively via stock-bevy feature unification, so Buiy
# must be CORRECT under it. This feature lets the CI lane (and consumers) build and
# test Buiy under the MT executor explicitly; enabling it on buiy_core unifies
# `bevy/multi_threaded` across the whole workspace build. See
# docs/specs/2026-06-30-mt-safety-design.md (D1).
multi_threaded = ["bevy/multi_threaded"]

# Render all feature-gated public items on docs.rs (e.g. ClipboardImage / get_image / set_image).
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
naga = "29"
proptest = { workspace = true }
# Performance bench harness (audit #40, DG-3): drives the `pipeline.rs` bench
# below. Dev-only + informational (see the workspace-dep comment); `harness =
# false` on the `[[bench]]` target hands `main` to criterion instead of libtest.
criterion = { workspace = true }
# P0c allocation-count gate — drives tests/alloc_budget.rs (its own isolated test
# binary with `#[global_allocator] dhat::Alloc`). Dev-only, cross-platform.
dhat = { workspace = true }
# Instruction-count pricer — drives benches/mvu_iai.rs (prototype-3 W1 L1). Dev-only;
# REQUIRES valgrind + iai-callgrind-runner at RUN time (the W1 dev host has neither, so
# the bench is a compile-only scaffold here). `harness = false` on the [[bench]] target.
iai-callgrind = { workspace = true }
# The shared adapterless extract harness + scenes for the perf benches/tests
# (criterion `pipeline`, the dhat alloc-budget test, the iai-callgrind bench).
# DEV-ONLY cycle (buiy_core → buiy_bench_support → buiy_core), the same pattern as
# the buiy_verify edge below: a [dev-dependencies] edge is excluded from the
# normal build graph, so it is never in the production/wasm graph. perf-final P0a.
buiy_bench_support = { path = "../buiy_bench_support" }
# Dev-only dependency edge for the #[ignore] GPU re-capture tests, which
# migrate off the deprecated `render::golden::perceptual_diff` (L1) onto
# `buiy_verify::metric::compare` (metric.md § Migration). This forms a
# DEV-ONLY cycle (buiy_core → buiy_verify → buiy_core): a [dev-dependencies]
# edge is excluded from the normal build graph, so Cargo permits it, the
# production `cargo build -p buiy_core` is unaffected, and it adds no
# `cargo deny` surface. Confined to #[cfg(test)].
buiy_verify = { path = "../buiy_verify" }

# Shape→layout→extract performance bench (audit #40, DG-3). INFORMATIONAL: run
# via `cargo bench -p buiy_core --bench pipeline`; NOT a CI pass/fail gate (a
# regression in the timing NUMBER must never fail the build). `harness = false`
# hands `fn main` to criterion (the dev-dep above) instead of libtest.
[[bench]]
name = "pipeline"
harness = false

# MVU substrate wall-clock bench (prototype-3 W1, L1 pricer). INFORMATIONAL: run
# via `cargo bench -p buiy_core --bench mvu`; NOT a CI gate (timing is host-
# dependent). The deterministic MVU gate is `MvuWorkCounters` (crosscut `mvu`
# tests). `harness = false` hands `fn main` to criterion.
[[bench]]
name = "mvu"
harness = false

# MVU instruction-count pricer (prototype-3 W1 L1). SCAFFOLD: requires valgrind +
# iai-callgrind-runner at RUN time (absent on the W1 dev host); W1 only `cargo
# check`s it. `harness = false` hands `fn main` to iai-callgrind.
[[bench]]
name = "mvu_iai"
harness = false
