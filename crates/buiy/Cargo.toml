[package]
name = "buiy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A comprehensive UI library for Bevy with web-quality accessibility."

[features]
# MT-safety: re-export buiy_core's opt-in `multi_threaded` passthrough (OFF by
# default). Buiy runs single-threaded in its own builds, but is kept CORRECT under
# Bevy's multithreaded executor (which downstream apps enable transitively). This
# lets a consumer opt in explicitly: `buiy = { ..., features = ["multi_threaded"] }`.
# See docs/specs/2026-06-30-mt-safety-design.md (D1).
multi_threaded = ["buiy_core/multi_threaded"]

# Render all feature-gated public items on docs.rs (badges + otherwise-hidden items).
[package.metadata.docs.rs]
all-features = true

[dependencies]
bevy.workspace = true
buiy_bsn = { path = "../buiy_bsn" }
buiy_core = { path = "../buiy_core" }
buiy_view = { path = "../buiy_view" }
buiy_widgets = { path = "../buiy_widgets" }
