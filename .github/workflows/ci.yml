name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Bevy's wayland/x11/udev features pull crates whose build.rs runs
      # pkg-config; clippy still drives those build scripts even though it
      # doesn't link, so the lint job needs the same system libs as test.
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rustdoc still drives Bevy's pkg-config-touching build scripts even
      # though it doesn't link, so this job needs the same Linux deps as
      # lint and test.
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pin cargo-deny to a known version so the config schema (v2)
      # stays in sync with the binary; bump in a dedicated PR that also
      # re-runs the check. `cargo audit` is intentionally not added —
      # `cargo deny check advisories` reads the same RustSec database,
      # so adding both would be redundant. taiki-e/install-action pulls
      # a prebuilt binary in seconds rather than rebuilding from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      # Runs all four checks (advisories, bans, licenses, sources).
      # The advisories check fails CI on RustSec vulnerabilities and on
      # `unmaintained` advisories that we have not explicitly ignored
      # in deny.toml.
      - name: cargo deny check
        run: cargo deny check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Free ~25 GB of preinstalled toolchains the ubuntu runner ships with
      # (.NET, Android SDK, GHC, CodeQL). The bevy workspace's debug target
      # dir + the growing set of test binaries crossed the ~14 GB free-disk
      # ceiling at E3, and a full disk surfaces as `ld ... signal 7 [Bus
      # error] core dumped` / "No space left on device" mid-link — not a
      # code failure. Runs before the cache restore so the cache lands on
      # the freed volume.
      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for Bevy
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev xvfb at-spi2-core
      - name: cargo test (headless via xvfb on Linux)
        if: matrix.os == 'ubuntu-latest'
        # debuginfo is the largest disk consumer for the bevy test binaries —
        # disabling it for the test profiles shrinks the target dir enough to
        # fit the runner alongside the disk-cleanup step above. -j 2 also caps
        # peak concurrent link temp files. (Root cause was disk exhaustion,
        # surfacing as ld SIGBUS — see the Free-disk step.)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: xvfb-run -a cargo test --workspace -j 2
      - name: cargo test (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

  # ----------------------------------------------------------------------------
  # GPU lane: the #[ignore] render/determinism/reftest tests that need a real
  # wgpu adapter, run against a version-PINNED Mesa lavapipe software rasterizer
  # (the determinism stack's CI rasterizer pin; determinism.md § "CI
  # software-rasterizer pin"). One canonical rasterizer ⇒ one golden per cell,
  # no per-OS/per-GPU matrix. This leg needs NO X server — Vulkan
  # render-to-texture is headless — so no xvfb.
  #
  # The headless `test` job above runs WITHOUT --ignored and never touches an
  # adapter, so it stays green on runners with no GPU; this leg is ADDITIVE.
  # Locally the same #[ignore] tests run on the real RX 6700 XT (the determinism
  # / reftest checks are rasterizer-internal invariants, not a stored-baseline
  # comparison, so they hold on either rasterizer).
  gpu:
    name: GPU (pinned lavapipe)
    runs-on: ubuntu-latest
    steps:
      # Reclaim ~25 GB by removing preinstalled SDKs this job never uses. The
      # release `wgpu-info` build + the large bevy `#[ignore]` GPU test binaries
      # + the pinned Mesa otherwise exhaust the ~14 GB runner disk ("No space
      # left on device" during `cargo test`). Must run before the rust-cache
      # restore + the compiles below.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Install the version-pinned lavapipe + export VK_DRIVER_FILES /
      # WGPU_ADAPTER_NAME=llvmpipe (NOT LP_NUM_THREADS — deviation #1).
      - name: Install pinned Mesa lavapipe
        uses: ./.github/actions/install-mesa
      # Smoke guard (determinism.md § Verification #5): before any golden runs,
      # confirm the selected adapter is lavapipe — the pin is active, not
      # silently falling back to a hardware adapter. `wgpu-info` reports the
      # adapter the same env contract selects.
      - name: Assert pinned lavapipe adapter is selected
        run: |
          set -euo pipefail
          cargo install --locked wgpu-info || true
          ADAPTERS="$(wgpu-info 2>/dev/null || true)"
          echo "${ADAPTERS}"
          echo "${ADAPTERS}" | grep -iq 'llvmpipe' \
            || { echo "::error::pinned lavapipe (llvmpipe) adapter not selected — VK_DRIVER_FILES/WGPU_ADAPTER_NAME wiring did not take effect"; exit 1; }
      # The GPU lane: serialize one adapter context at a time (--test-threads=1).
      # No --ignored on the headless job above; this is the only leg that
      # instantiates an adapter.
      - name: cargo test (GPU #[ignore] lane on pinned lavapipe)
        run: |
          cargo test -p buiy_core -j 2 -- --ignored --test-threads=1
          cargo test -p buiy_verify -j 2 -- --ignored --test-threads=1
