name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly cadence (audit #15 + #30): re-exercise the EXACT(0,0) Mesa-brittle
  # goldens and the proptest invariants on a schedule so a silent Mesa/toolchain
  # drift is caught within a week rather than only on the next unrelated PR.
  # Monday 06:00 UTC. The heavy llvm-cov job is gated to push/schedule (its
  # `if:`), so PRs are not slowed by this trigger. The concurrency rule below
  # only cancels pull_request runs, so a scheduled run is never pre-empted by
  # (nor pre-empts) a push-to-main — its whole purpose is to run independently.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege, made explicit rather than relying on the (currently
# read-only) repo-level default — so flipping the repo "Workflow permissions"
# setting back to read/write can't silently re-grant a write-scoped token. No
# job needs more than read; give any future write-needing job its own per-job
# override instead of widening this.
permissions:
  contents: read

# Cancel superseded runs for the same ref on PRs (the heavy 3-OS matrix + GPU
# lane otherwise stack on rapid pushes). Never cancel push-to-main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to full commit SHAs (not mutable tags/branches)
# so a tag/branch repoint or a compromised maintainer account can't silently
# change what runs in a job (the tj-actions/changed-files class, CVE-2025-30066).
# The trailing comment records the human-readable version. There is no Dependabot
# in this repo by choice, so these pins are bumped MANUALLY — when updating an
# action, replace the SHA and the version comment together.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Bevy's wayland/x11/udev features pull crates whose build.rs runs
      # pkg-config; clippy still drives those build scripts even though it
      # doesn't link, so the lint job needs the same system libs as test.
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The default `cargo clippy --workspace` above only compiles DEFAULT
      # features, so buiy_core's optional-feature paths are otherwise never built
      # — a cfg typo / unused import there would pass every gate. Compile both
      # corners: default_font OFF (zero-font path) and all features ON
      # (clipboard-image → arboard/image-data). See
      # docs/plans/2026-06-21-ci-hardening.md slice 6.
      - name: clippy (buiy_core, no default features)
        run: cargo clippy -p buiy_core --no-default-features --all-targets --locked -- -D warnings
      - name: clippy (buiy_core, all features)
        run: cargo clippy -p buiy_core --all-features --all-targets --locked -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # rustdoc still drives Bevy's pkg-config-touching build scripts even
      # though it doesn't link, so this job needs the same Linux deps as
      # lint and test.
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
      # Pin cargo-deny to a known version so the config schema (v2)
      # stays in sync with the binary; bump in a dedicated PR that also
      # re-runs the check. `cargo audit` is intentionally not added —
      # `cargo deny check advisories` reads the same RustSec database,
      # so adding both would be redundant. taiki-e/install-action pulls
      # a prebuilt, checksum-verified binary in seconds rather than rebuilding.
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-deny@0.19.4
      # Runs all four checks (advisories, bans, licenses, sources) against the
      # committed Cargo.lock. The advisories check fails CI on RustSec
      # vulnerabilities and on `unmaintained` advisories that we have not
      # explicitly ignored in deny.toml.
      - name: cargo deny check
        run: cargo deny --locked check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Free ~25 GB of preinstalled SDKs the ubuntu runner ships with. The bevy
      # workspace's debug target dir + the growing set of test binaries crossed
      # the ~14 GB free-disk ceiling at E3, and a full disk surfaces as `ld ...
      # signal 7 [Bus error]` / "No space left on device" mid-link — not a code
      # failure. Runs before the cache restore so the cache lands on the freed
      # volume. Shared with the gpu job via the composite action.
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The CI test runner is cargo-nextest (audit #9 / plan T5.2, DG-2): it runs
      # the consolidated 7-binary suite (T5.1) with per-test process isolation +
      # built-in flaky-retry. Combined with the 162→7 binary collapse this removes
      # the per-binary bevy-relink fan-out behind the ~63-min `cargo test` baseline
      # (#9). cargo-insta drives nextest for the headless run so the SAME pass also
      # rejects unreferenced/stale committed .snap orphans (#17, plan T5.2b). Both
      # are prebuilt, checksum-verified binaries via the SHA-pinned install-action;
      # versions are pinned so the runner schema stays reproducible (bump
      # deliberately). insta is pinned to the exact crate version the workspace
      # depends on so the runner and the library agree on the .snap format.
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest@0.9.133,cargo-insta@1.48.0
      - name: Install Linux deps for Bevy
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev xvfb at-spi2-core
      # debuginfo for the dev/test profiles is disabled in root Cargo.toml
      # ([profile.dev]/[profile.test] debug = 0, audit #10); the 162→7 binary
      # collapse (#9, T5.1) removed the link-OOM fan-out, so no per-job
      # CARGO_PROFILE_* env or `-j 2` cap is needed here.
      #
      # Lock-freshness guard for the insta step: cargo-insta does NOT forward
      # `--locked` to the build it drives, so this cheap `cargo tree --locked`
      # resolves the graph against the committed Cargo.lock (no network, no build)
      # and fails if the lock is stale/absent before the insta run builds it.
      - name: Assert Cargo.lock is current (--locked guard for the insta step)
        if: matrix.os == 'ubuntu-latest'
        run: cargo tree --locked --workspace --depth 0 > /dev/null
      # Linux: cargo-insta drives nextest, so this single step (a) runs the whole
      # consolidated headless suite under xvfb and (b) fails on any
      # unreferenced/stale committed .snap (`--unreferenced=reject`, the real #17
      # fix). A snapshot MISMATCH also fails here via insta's CI default.
      # `--disable-nextest-doctest` leaves doctests to the dedicated step below.
      - name: cargo insta test + nextest (headless via xvfb on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a cargo insta test --workspace --test-runner nextest --unreferenced=reject --disable-nextest-doctest
      # macOS / Windows: plain nextest (snapshots are platform-independent text, so
      # the unreferenced gate runs once on Linux). A mismatch still fails here.
      - name: cargo nextest run (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo nextest run --workspace --locked
      # nextest never runs doctests (separate libtest harness), so the runnable
      # doctests (plan T4.1) get their own fast step on every OS.
      - name: cargo test --doc (doctests, all OSes)
        run: cargo test --doc --workspace --locked
      # Snapshot hygiene (audit #17): a force-committed *.snap.new (pending) is
      # gitignored, so only `git add -f` lands one; --unreferenced won't flag a
      # pending snap (not an orphan), so this git-ls-files check guards it.
      - name: Snapshot hygiene (no committed pending snapshots)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          pending="$(git ls-files '*.snap.new')"
          if [ -n "${pending}" ]; then
            echo "::error::pending insta snapshots are committed — run cargo insta review; never commit *.snap.new:"
            echo "${pending}"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # MT-safety lane: build + run the headless suite under Bevy's `multi_threaded`
  # ECS executor. Buiy builds single-threaded by default (the `test` job above),
  # but downstream consumers enable `multi_threaded` transitively via stock-bevy
  # feature unification — so Buiy MUST be correct under the MT executor, and this
  # lane proves it. Enabling the feature on buiy_core unifies `bevy/multi_threaded`
  # across the whole workspace build. The dhat alloc-budget gate is a
  # single-threaded measurement and compiles out here by design (see
  # crates/buiy_core/tests/alloc_budget.rs). Linux-only: MT-correctness is
  # OS-independent, so one runner suffices. See docs/specs/2026-06-30-mt-safety-design.md.
  test-multi-threaded:
    name: Test (multi_threaded executor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest@0.9.133
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev xvfb at-spi2-core
      # Enabling buiy_core/multi_threaded unifies bevy/multi_threaded across the
      # workspace, so the whole headless suite runs under the MT executor. The
      # feature is lock-clean (it only flips compile-cfg), so `--locked` holds.
      - name: cargo nextest run (headless under multi_threaded, xvfb)
        run: xvfb-run -a cargo nextest run --workspace --locked --features buiy_core/multi_threaded

  # ----------------------------------------------------------------------------
  # MSRV gate: the workspace declares `rust-version` (Cargo.toml
  # [workspace.package]); without a job that actually builds on it, a post-MSRV
  # API/syntax use — or a dependency raising its own MSRV on a semver-compatible
  # bump — passes CI while breaking the advertised floor. `cargo check` (not
  # test) is enough to catch that, and `--locked` ties it to the committed graph.
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repo-root rust-toolchain.toml pins `channel = "stable"`, and an override
    # file beats `rustup default` (which dtolnay/rust-toolchain sets) in rustup's
    # precedence — so without this, `cargo check` below would silently build on
    # stable, not 1.95, making the gate a no-op. RUSTUP_TOOLCHAIN outranks the
    # override file, forcing the 1.95 floor to actually be exercised.
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: cargo check (workspace, MSRV)
        run: cargo check --workspace --locked

  # ----------------------------------------------------------------------------
  # GPU lane: the #[ignore] render/determinism/reftest tests that need a real
  # wgpu adapter, run against a version-PINNED Mesa lavapipe software rasterizer
  # (the determinism stack's CI rasterizer pin; determinism.md § "CI
  # software-rasterizer pin"). One canonical rasterizer ⇒ one golden per cell,
  # no per-OS/per-GPU matrix. This leg needs NO X server — Vulkan
  # render-to-texture is headless — so no xvfb.
  #
  # The headless `test` job above runs WITHOUT --ignored and never touches an
  # adapter, so it stays green on runners with no GPU; this leg is ADDITIVE.
  # Locally the same #[ignore] tests run on the real RX 6700 XT (the determinism
  # / reftest checks are rasterizer-internal invariants, not a stored-baseline
  # comparison, so they hold on either rasterizer).
  gpu:
    name: GPU (pinned lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # This lane links the large bevy #[ignore] test binaries AFTER also
      # building wgpu-info (release) + running the buiy_core GPU suite, so it has
      # far less headroom than the plain Test job and `ld` SIGBUSes (signal 7)
      # linking buiy_verify's test binaries. Debug info is the bulk of that link
      # size, and GPU pixel/invariant checks don't need backtraces — drop it for
      # this lane only. Keep the workspace-wide `-D warnings`.
      RUSTFLAGS: "-D warnings -C debuginfo=0"
    steps:
      # Checkout first: the Free-disk and Install-Mesa steps below are LOCAL
      # composite actions (./.github/actions/...), which must exist on disk —
      # i.e. the repo must already be checked out — before they can run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Reclaim ~25 GB by removing preinstalled SDKs this job never uses (shared
      # with the test job via the composite action). The release `wgpu-info`
      # build + the large bevy `#[ignore]` GPU test binaries + the pinned Mesa
      # otherwise exhaust the ~14 GB runner disk. Must run before the rust-cache
      # restore + the compiles below (checkout itself is cheap on disk).
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Install the version-pinned lavapipe + export VK_DRIVER_FILES /
      # WGPU_ADAPTER_NAME=llvmpipe (NOT LP_NUM_THREADS — deviation #1). The
      # composite action verifies the tarball SHA-256 before extracting.
      - name: Install pinned Mesa lavapipe
        uses: ./.github/actions/install-mesa
      # Smoke guard (determinism.md § Verification #5): before any golden runs,
      # confirm the selected adapter is lavapipe — the pin is active, not
      # silently falling back to a hardware adapter. `wgpu-info` reports the
      # adapter the same env contract selects. Pin the wgpu-info version for
      # reproducibility (matches the in-tree wgpu 29 line); bump alongside wgpu.
      - name: Assert pinned lavapipe adapter is selected
        run: |
          set -euo pipefail
          cargo install --locked --version 29.0.3 wgpu-info || true
          ADAPTERS="$(wgpu-info 2>/dev/null || true)"
          echo "${ADAPTERS}"
          echo "${ADAPTERS}" | grep -iq 'llvmpipe' \
            || { echo "::error::pinned lavapipe (llvmpipe) adapter not selected — VK_DRIVER_FILES/WGPU_ADAPTER_NAME wiring did not take effect"; exit 1; }
      # cargo-nextest runs the GPU lane via the `gpu` profile (.config/nextest.toml:
      # the gpu-serial test-group caps it to one adapter context at a time, with
      # flaky-retry). No --ignored on the headless job above; this is the only leg
      # that instantiates an adapter. Includes the buiy facade GPU test (T0.2).
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest@0.9.133
      - name: cargo nextest run (GPU #[ignore] lane on pinned lavapipe)
        run: cargo nextest run --profile gpu -p buiy_core -p buiy_verify -p buiy --locked --run-ignored=only

  # ----------------------------------------------------------------------------
  # Web smoke. GATES the wasm BUILD always (catches arboard/lock/feature
  # regressions — buiy + the example must compile + wasm-bindgen for wasm32).
  # Then loads the build in headless Chrome and, IF a WebGPU adapter is present,
  # enforces ZERO shader/pipeline errors + a non-blank canvas — the only check
  # that runs the real Tint compiler, so the only one that catches the
  # WGSL-uniformity class the native GPU lane (naga, lenient by design) cannot see
  # (spec § 4 / D2; it already caught gradient.wgsl shipping the bug).
  #
  # Software WebGPU is NOT available on the GPU-less hosted runner — Dawn exposes
  # no adapter over lavapipe, and headless SwiftShader yields none either (every
  # flag combination tried gives requestAdapter() -> null). So on this runner the
  # shader/paint check SKIPS (the runner detects "no adapter" and exits 0); it is
  # enforced wherever a WebGPU adapter exists (dev GPU hosts; a future
  # WebGPU-capable CI runner). This matches the foundation's web =
  # manual-release-gate stance for the render dimension. Follow-up to make it
  # fully CI-enforced (tint CLI, or a self-hosted GPU runner): follow-ups.md.
  # The WebGL2 reach backend (spec 2026-06-30 § D4) is smoked in the SAME job:
  # software WebGL2 (SwiftShader) IS available on the GPU-less runner, so its
  # shader-conformance + paint check is FULLY ENFORCED here (unlike the WebGPU
  # leg, which skips without an adapter). Both examples now select the backend via
  # `--features webgpu|webgl2` (neither is a default — the two bevy meta-features
  # can't coexist in one binary, so reach = two artifacts + a loader).
  web-smoke:
    name: Web smoke (WebGPU + WebGL2 headless)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: trunk@0.21.14,wasm-bindgen-cli@0.2.125
      - name: Build the WebGPU wasm example
        run: trunk build examples/buiy_web/index.html --features webgpu --dist examples/buiy_web/dist
      - name: Build the WebGL2 wasm example (the reach backend)
        run: trunk build examples/buiy_web/index.html --features webgl2 --dist examples/buiy_web/dist-webgl2
      - name: Install smoke deps + chromium
        working-directory: tools/web-smoke
        run: |
          npm ci
          npx --yes playwright@1.61.1 install --with-deps chromium
      - name: Run the headless WebGPU smoke
        working-directory: tools/web-smoke
        run: |
          python3 -m http.server 8090 --directory ../../examples/buiy_web/dist &
          sleep 2
          CHROME_BIN="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          export CHROME_BIN
          echo "CHROME_BIN=$CHROME_BIN"
          SMOKE_URL=http://localhost:8090/ node run.mjs
      - name: Run the headless WebGL2 smoke (SwiftShader — ENFORCED)
        working-directory: tools/web-smoke
        run: |
          python3 -m http.server 8091 --directory ../../examples/buiy_web/dist-webgl2 &
          sleep 2
          CHROME_BIN="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          export CHROME_BIN
          SMOKE_URL=http://localhost:8091/ node run-webgl2.mjs

  # ----------------------------------------------------------------------------
  # Coverage (informational, audit #41 / DG-4): produces an lcov artifact; no
  # pass/fail gate yet. Gated to push/schedule (not PRs) so it never slows PR
  # turnaround. cargo-llvm-cov drives the headless suite under xvfb.
  llvm-cov:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master @ 2026-06-20
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev xvfb at-spi2-core
      - name: cargo llvm-cov (headless, informational)
        run: xvfb-run -a cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov.info
          path: lcov.info
