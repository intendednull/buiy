<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ wrapStyle }}">
  <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
    <img src="{{ imgSrc }}" alt="{{ altText }}" style="{{ imgStyle }}" />
  </sc-if>
  <sc-if value="{{ showIcon }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 40 40" style="{{ svgStyle }}">
      <sc-for list="{{ iconPaths }}" as="p" hint-placeholder-count="3">
        <path d="{{ p.d }}" fill="none" stroke="{{ strokeColor }}" stroke-width="{{ strokeW }}" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <sc-for list="{{ iconLines }}" as="ln" hint-placeholder-count="2">
        <line x1="{{ ln.x1 }}" y1="{{ ln.y1 }}" x2="{{ ln.x2 }}" y2="{{ ln.y2 }}" stroke="{{ strokeColor }}" stroke-width="{{ strokeW }}" stroke-linecap="round"></line>
      </sc-for>
      <sc-for list="{{ iconCircles }}" as="c" hint-placeholder-count="1">
        <circle cx="{{ c.cx }}" cy="{{ c.cy }}" r="{{ c.r }}" fill="none" stroke="{{ strokeColor }}" stroke-width="{{ strokeW }}"></circle>
      </sc-for>
      <sc-for list="{{ iconEllipses }}" as="el" hint-placeholder-count="1">
        <ellipse cx="{{ el.cx }}" cy="{{ el.cy }}" rx="{{ el.rx }}" ry="{{ el.ry }}" fill="none" stroke="{{ strokeColor }}" stroke-width="{{ strokeW }}"></ellipse>
      </sc-for>
      <sc-for list="{{ iconDots }}" as="d" hint-placeholder-count="2">
        <circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ strokeColor }}"></circle>
      </sc-for>
    </svg>
  </sc-if>
</span>
</x-dc>

const ICON_KEYS = Object.keys(ICONS);

function hashStr(str) {
  let h = 0;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

class Component extends DCLogic {
  renderVals() {
    const props = this.props || {};
    const size = Number(props.size) || 40;
    const src = props.src;
    const hasImage = !!src;
    const showIcon = !hasImage;

    let iconKey = props.forceIcon;
    if (!iconKey || !ICONS[iconKey]) {
      iconKey = ICON_KEYS[hashStr(props.personName || '?') % ICON_KEYS.length];
    }
    let tint = props.forceTint;
    if (!tint) {
      tint = TINTS[hashStr((props.personName || iconKey || '?') + '-tint') % TINTS.length];
    }
    const icon = ICONS[iconKey] || ICONS[ICON_KEYS[0]];

    return {
      hasImage, showIcon,
      imgSrc: src, altText: (props.personName || 'avatar') + ' profile picture',
      wrapStyle: {
        width: size, height: size, borderRadius: '50%',
        background: hasImage ? '#e4e4e7' : tint,
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden', flex: 'none', position: 'relative', boxSizing: 'border-box',
        border: '1.5px solid rgba(0,0,0,.22)',
      },
      imgStyle: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
      svgStyle: { width: '68%', height: '68%', display: 'block', overflow: 'visible' },
      strokeColor: '#ffffff', strokeW: 2.6,
      iconPaths: icon.paths || [],
      iconLines: icon.lines || [],
      iconCircles: icon.circles || [],
      iconEllipses: icon.ellipses || [],
      iconDots: icon.dots || [],
    };
  }
}
