[package]
name = "buiy_workspace"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Workspace root package; exists only to host workspace-level integration tests."

[lib]
path = "src/lib.rs"

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_winit", "x11", "wayland"] }
buiy = { path = "crates/buiy" }
buiy_core = { path = "crates/buiy_core" }
buiy_verify = { path = "crates/buiy_verify" }

[workspace]
resolver = "2"
members = [
    "crates/buiy",
    "crates/buiy_core",
    "crates/buiy_widgets",
    "crates/buiy_verify",
    "examples/hello_button",
    "examples/hello_text",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/intendednull/buiy"
rust-version = "1.85"

[workspace.dependencies]
# Phase 0 keeps the workspace dep set minimal: only crates that have a
# `use` in `src/` are listed. Speculative deps (accesskit, accesskit_winit,
# bevy_picking backend, image-compare for SSIM, thiserror for typed errors)
# return when the consuming task lands. See review notes in
# docs/plans/2026-05-07-buiy-phase-0-foundations.md.
# Phase 0 closeout (2026-05-08) added: bytemuck (instance buffer POD),
# accesskit + accesskit_winit (per-window adapter), bevy_picking feature
# on bevy. Still deferred: image-compare (visual harness upgrade is v0.x
# verification work), thiserror (no error-typing pressure yet).
bevy = { version = "0.18", default-features = false, features = ["bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_window", "bevy_asset", "bevy_log", "bevy_picking", "x11", "wayland"] }
taffy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
proptest = "1"
# Clipboard for the text editor (editing-and-ime § 7). arboard is the
# ecosystem standard (egui/bevy_egui lineage), 1Password-stewarded,
# MIT/Apache. v1 ships PLAIN TEXT only — HTML/image flavors are the named
# follow-up slice (spec § 13, pre-campaign decision 4) — so default features
# are OFF: `image-data` (the default) drags in the `image` crate +
# `objc2-core-graphics` on macOS for image clipboard, which the text-only
# adoption never uses (m2). The text backends — x11rb (Linux/X11),
# clipboard-win (Windows), objc2-app-kit (macOS) — are NOT behind
# `image-data`, so text cut/copy/paste works with default features disabled.
# Linux defaults to X11 (`x11rb`); native Wayland needs the non-default
# `wayland-data-control` feature, deferred — v1 reaches Wayland via XWayland,
# and `ArboardClipboard::new()` degrades gracefully if no backend is present
# (m3). Behind the ClipboardProvider facade so tests inject a fake and the
# dep stays swappable.
arboard = { version = "3.6", default-features = false }
tracing = "0.1"
# Phase 0 closeout deps (closeout plan 2026-05-08).
bytemuck = { version = "1", features = ["derive"] }
accesskit = "0.21"
accesskit_winit = "0.29"
# guillotiere is only a *transitive* dep of bevy_image (not re-exported);
# pin it directly to the version bevy_image 0.18.1 resolves so a bevy patch
# bump cannot drop the atlas allocator. Spec atlas-and-text-seam.md § 2.1.
guillotiere = "=0.6.2"
smallvec = "1"
