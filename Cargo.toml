[package]
name = "buiy_workspace"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Workspace root package; exists only to host workspace-level integration tests."

[lib]
path = "src/lib.rs"

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_winit", "x11", "wayland"] }
buiy = { path = "crates/buiy" }
buiy_core = { path = "crates/buiy_core" }
buiy_verify = { path = "crates/buiy_verify" }

[workspace]
resolver = "2"
members = [
    "crates/buiy",
    "crates/buiy_bsn",
    "crates/buiy_core",
    "crates/buiy_widgets",
    "crates/buiy_verify",
    "examples/buiy_gallery",
    "examples/hello_bsn",
    "examples/hello_button",
    "examples/hello_text",
    "examples/capture",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/intendednull/buiy"
# Real floor, CI-verified by the `msrv` job. bevy 0.19 / bevy_ecs declare
# rust-version 1.95, which dominates the dep graph (the next-highest are
# bevy_math/bevy_input_focus 1.94, cosmic-text/smol_str 1.89, image 1.88). The
# prior `1.85` was stale — it predated the bevy 0.18→0.19 bump and was never
# enforced. Bump deliberately when the `msrv` CI job goes red on a dep raising
# the floor.
rust-version = "1.95"

[workspace.dependencies]
# Phase 0 keeps the workspace dep set minimal: only crates that have a
# `use` in `src/` are listed. Speculative deps (accesskit, accesskit_winit,
# bevy_picking backend, image-compare for SSIM, thiserror for typed errors)
# return when the consuming task lands. See review notes in
# docs/plans/2026-05-07-buiy-phase-0-foundations.md.
# Phase 0 closeout (2026-05-08) added: bytemuck (instance buffer POD),
# accesskit + accesskit_winit (per-window adapter), bevy_picking feature
# on bevy. Still deferred: image-compare (visual harness upgrade is v0.x
# verification work), thiserror (no error-typing pressure yet).
bevy = { version = "0.19.0-rc.3", default-features = false, features = ["bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_window", "bevy_asset", "bevy_log", "bevy_picking", "bevy_scene", "x11", "wayland"] }
taffy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
# Vector-icon tessellation (parity Wave B3, parity-design § 3.5). `lyon` is the
# stroke/fill tessellator (round caps/joins, arc flattening); `lyon_extra`
# carries the SVG-path-`d` parser (`lyon_extra::parser`, over `svgtypes`). Both
# MIT/Apache-2.0, no_std-friendly, pure-CPU (no GPU/sys deps). Consumed only by
# `buiy_core::render::icon_raster` to produce R8 coverage for the glyph-alpha
# atlas — see crates/buiy_core/Cargo.toml for the full rationale.
lyon = "1.0"
lyon_extra = "1.1"
proptest = "1"
# Clipboard for the text editor (editing-and-ime § 7). arboard is the
# ecosystem standard (egui/bevy_egui lineage), 1Password-stewarded,
# MIT/Apache. v1 ships PLAIN TEXT only — HTML/image flavors are the named
# follow-up slice (spec § 13, pre-campaign decision 4) — so default features
# are OFF: `image-data` (the default) drags in the `image` crate +
# `objc2-core-graphics` on macOS for image clipboard, which the text-only
# adoption never uses (m2). The text backends — x11rb (Linux/X11),
# clipboard-win (Windows), objc2-app-kit (macOS) — are NOT behind
# `image-data`, so text cut/copy/paste works with default features disabled.
# Linux defaults to X11 (`x11rb`); native Wayland needs the non-default
# `wayland-data-control` feature, deferred — v1 reaches Wayland via XWayland,
# and `ArboardClipboard::new()` degrades gracefully if no backend is present
# (m3). Behind the ClipboardProvider facade so tests inject a fake and the
# dep stays swappable.
arboard = { version = "3.6", default-features = false }
tracing = "0.1"
# Phase 0 closeout deps (closeout plan 2026-05-08).
bytemuck = { version = "1", features = ["derive"] }
accesskit = "0.24"
accesskit_winit = "0.32"
# In-process AccessKit consumer — the gate-#3 read tier the agent-interface
# in-process driver and `buiy_verify` snapshot path drive (inprocess-api.md §6,
# verification.md "accesskit_consumer dependency"). Version matches the resolved
# accesskit 0.24.1: the accesskit_winit 0.32.2 → accesskit_unix 0.21.1 →
# accesskit_atspi_common 0.18.1 stack already pulls accesskit_consumer 0.36.0
# (`cargo tree -i accesskit_consumer@0.36.0`), so this declares an EXISTING graph
# node — no new crate enters the tree. (0.35/0.37 are orphan lock entries with no
# reverse-dep.) Consumed by `buiy_verify` (the consumer-helper home, co-drive §5
# SC-4 single-home); `buiy_core` reaches it transitively, so the dep is declared
# in `buiy_verify`, not `buiy_core`, until the production `inprocess.rs` lands.
accesskit_consumer = "0.36"
# guillotiere is only a *transitive* dep of bevy_image (not re-exported);
# pin it directly to the version bevy_image 0.19.0-rc.3 resolves (0.6.2, which
# satisfies bevy_image's "0.6.0" req) so a bevy patch bump cannot drop the atlas
# allocator. Spec atlas-and-text-seam.md § 2.1.
guillotiere = "=0.6.2"
smallvec = "1"
# Tier-5 golden bless ledger (goldens.md § "The bless ledger"): `<slug>.toml`
# beside the PNGs is the durable, human-diffable accept record reviewed as the
# PR diff. MIT/Apache-2.0, already transitively present via cargo tooling;
# `cargo deny check` gates the add.
toml = "0.8"
# Tier-5 self-contained HTML triage report (goldens.md § "Diff-PNG + HTML"):
# base64-inline the actual/baseline/diff PNGs so the report is offline-first —
# openable straight from CI artifacts, no external assets, no SaaS. MIT/Apache-2.0.
base64 = "0.22"
# Performance bench harness (audit #40, DG-3): the ecosystem-standard
# statistical micro-benchmark runner for the shape→layout→extract pipeline
# bench (`crates/buiy_core/benches/`). DEV-ONLY (a `[[bench]]` dependency, never
# in the production graph); INFORMATIONAL (run via `cargo bench`, NOT a CI
# pass/fail gate — a slower NUMBER must never fail the build). Default features
# OFF: the default `rayon`/`plotters` html-report machinery is unused here (we
# want a fast-compiling, low-dep harness for a non-gating signal), so only the
# `cargo_bench_support` feature is kept (the `cargo bench` integration). MIT/
# Apache-2.0; `cargo deny check` gates the add.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# --- Build profiles --------------------------------------------------------
# Disable debuginfo for the dev + test profiles. The bulk of CI target-dir disk
# is the bevy DEPENDENCY artifacts, which under `cargo test` build with the dev
# profile; their debuginfo is what crossed the runner's ~14 GB free-disk ceiling
# and surfaced as `ld ... signal 7 [Bus error]` / "No space left on device"
# mid-link (audit finding #10). Setting this here (rather than via per-job
# CARGO_PROFILE_* env / per-job `-C debuginfo=0` RUSTFLAGS) keeps every CI lane
# consistent AND lets all lanes share one Swatinem/rust-cache key (RUSTFLAGS is
# part of that key, so divergent `-C debuginfo=0` previously fragmented the GPU
# lane's cache). These two settings exactly replace the removed
# CARGO_PROFILE_DEV_DEBUG=0 / CARGO_PROFILE_TEST_DEBUG=0.
#
# Tradeoff: this also disables debuginfo for LOCAL dev builds, so local
# backtraces lose line info. `debug = 0` is the proven disk fix; if local DX
# matters more, `debug = "line-tables-only"` keeps backtrace line numbers at a
# larger target dir — flagged for the coordinator, not silently chosen here.
[profile.dev]
debug = 0

[profile.test]
debug = 0
