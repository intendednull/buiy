[package]
name = "hello_mvu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_winit", "x11", "wayland"] }
buiy = { path = "../../crates/buiy" }
# MVU lives in `buiy_core::mvu` — it is NOT yet re-exported through the `buiy`
# umbrella (a known ergonomics gap; see docs/reports/2026-06-30-documentation-coverage-audit.md),
# so an app authoring its own model depends on `buiy_core` directly.
buiy_core = { path = "../../crates/buiy_core" }
