[package]
name = "hello_button"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hello_button"
path = "src/main.rs"

# GPU capture: render the counter offscreen + read back to PNG (prototype RUN+view).
[[bin]]
name = "capture_counter"
path = "src/bin/capture_counter.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_core_pipeline", "bevy_winit", "x11", "wayland"] }
buiy = { path = "../../crates/buiy" }
# The MVU demo code uses only `buiy`'s prelude. `buiy_core` is here solely for the
# headless test + GPU-capture harnesses (theme/a11y/plugin composition).
buiy_core = { path = "../../crates/buiy_core" }
image = { workspace = true }
