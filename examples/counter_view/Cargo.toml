[package]
name = "counter_view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Windowed demo (needs a display).
[[bin]]
name = "counter_view"
path = "src/main.rs"

# Headless GPU capture → PNG (needs a wgpu adapter, no display).
[[bin]]
name = "capture_counter_view"
path = "src/bin/capture_counter_view.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_core_pipeline", "bevy_winit", "x11", "wayland"] }
# The view-authoring surface under test.
buiy_view = { path = "../../crates/buiy_view" }
# `buiy` provides the plugin composition (`BuiyPlugin` / `BuiyHeadlessPlugin`);
# `buiy_core` is used by the capture harness (theme + the test-id helpers).
buiy = { path = "../../crates/buiy" }
buiy_core = { path = "../../crates/buiy_core" }
image = { workspace = true }
