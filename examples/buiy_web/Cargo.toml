[package]
name = "buiy_web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Render backend, selected at (wasm) build time via `trunk --features webgpu|webgl2`.
# NEITHER is default: on NATIVE the `--workspace` build enables neither — wgpu
# auto-selects Vulkan/Metal/DX12 — so it never compiles a web backend or the 3D
# crates the meta-features drag in. WebGPU = the preferred backend (needs an enabled
# WebGPU adapter — flag-gated on Firefox/older Safari/some Linux). WebGL2 = the reach
# backend, unflagged in every modern browser. The two bevy meta-features cannot
# coexist in one binary (`webgpu` wins), so reach = two artifacts + a loader.
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
bevy = { workspace = true }
buiy = { path = "../../crates/buiy" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A panic hook that routes Rust panics to the browser console (the backend bevy
# meta-feature comes from `[features]` above, selected per `trunk --features`).
console_error_panic_hook = "0.1"
