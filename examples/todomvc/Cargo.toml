[package]
name = "todomvc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "TodoMVC built on the Buiy MVU paradigm (prototype) — the canonical real MVU app, used to pressure-test the keyed-list / structural-reconcile bind."

[lib]
path = "src/lib.rs"

[[bin]]
name = "todomvc"
path = "src/main.rs"

[[bin]]
name = "capture_todomvc"
path = "src/bin/capture_todomvc.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_core_pipeline", "bevy_winit", "x11", "wayland"] }
buiy = { path = "../../crates/buiy" }
# DX-1: MVU is not in the `buiy` prelude — second, direct dep required.
buiy_core = { path = "../../crates/buiy_core" }
image = { workspace = true }
